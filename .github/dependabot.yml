version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(web-deps)"
    labels:
      - "dependencies"
      - "web"
    allow:
      - dependency-type: "production"
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(mobile-deps)"
    labels:
      - "dependencies"
      - "mobile"
    allow:
      - dependency-type: "production"
    groups:
      mobile-dependencies:
        patterns:
          - "*"
    ignore:
      # Pinned to Expo SDK version matrix; managed via `npx expo install` during SDK upgrades
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-svg"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "eslint-config-expo"
