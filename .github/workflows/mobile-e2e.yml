name: Mobile E2E (Maestro)

# Informational (non-required) Android E2E smoke test running on standard hosted
# ubuntu-latest runners with KVM enabled, against a local Wrangler + local D1
# backend (zero EAS build credits consumed, never touches production or remote D1).
#
# Settled implementation notes (#200):
# - Triggered via path-filtered PRs touching mobile/shared/Maestro/test-login
#   files and manual workflow_dispatch.
# - Uses an env-gated "Test Sign In" button compiled only when BOTH
#   EXPO_PUBLIC_ALLOW_DEV_TEST_AUTH=true and a loopback http:// API URL are set.
# - Android first; iOS E2E is deferred to a later slice (either hosted macOS or
#   a self-hosted Mac runner).
# - Future pivot: self-hosted runners on Chris's server remain an option if
#   builds/emulators need more speed, the repo goes private, or iOS hardware is
#   added. Never attach self-hosted runners to untrusted fork PR workflows.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      - ".maestro/**"
      - "app/routes/api.v1.dev.test-login.ts"
      - "app/auth.server.ts"
      - "app/auth-context.server.ts"
      - ".github/workflows/mobile-e2e.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Mobile E2E (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Sync shared modules and version
        working-directory: mobile
        run: |
          node scripts/sync-shared.js
          node scripts/sync-version.js

      - name: Prepare local backend (D1 migrations + web build)
        run: |
          npx wrangler d1 migrations apply synx-db --local
          npm run build

      - name: Ensure dummy google-services.json for prebuild
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "mobile/google-services.json";
            if (!fs.existsSync(p)) {
              const dummy = {
                project_info: {
                  project_number: "000000000000",
                  project_id: "synx-e2e-local",
                  storage_bucket: "synx-e2e-local.firebasestorage.app"
                },
                client: [{
                  client_info: {
                    mobilesdk_app_id: "1:000000000000:android:0000000000000000000000",
                    android_client_info: { package_name: "io.christran.synx" }
                  },
                  oauth_client: [],
                  api_key: [{ current_key: "AIzaSyDummyLocalE2eKey000000000000000000" }],
                  services: { appinvite_service: { other_platform_oauth_client: [] } }
                }],
                configuration_version: "1"
              };
              fs.writeFileSync(p, JSON.stringify(dummy, null, 2));
            }
          '

      - name: Prebuild Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_ALLOW_DEV_TEST_AUTH: "true"
          EXPO_PUBLIC_API_URL: "http://127.0.0.1:8787"
        run: npx expo prebuild --platform android --non-interactive

      - name: Embed JS bundle in debug APK
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "mobile/android/app/build.gradle";
            let src = fs.readFileSync(p, "utf8");
            const target = "// debuggableVariants = [\"liteDebug\", \"prodDebug\"]";
            if (!src.includes(target)) {
              throw new Error("Could not find debuggableVariants placeholder in " + p);
            }
            src = src.replace(target, "debuggableVariants = []");
            fs.writeFileSync(p, src, "utf8");
          '

      - name: Build Android debug APK (x86_64)
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_ALLOW_DEV_TEST_AUTH: "true"
          EXPO_PUBLIC_API_URL: "http://127.0.0.1:8787"
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Start local Wrangler backend
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 --var ALLOW_DEV_TEST_AUTH:true --var MOBILE_MIN_BUILD_VERSION:1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/v1/mobile/version >/dev/null 2>&1; then
              echo "Local Wrangler backend ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wrangler.log || true
          exit 1

      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"
            export MAESTRO_CLI_NO_ANALYTICS=1
            export MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true
            adb reverse tcp:8787 tcp:8787
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/smoke.yaml --debug-output /tmp/maestro-debug

      - name: Upload Maestro & Wrangler debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-logs
          include-hidden-files: true
          path: |
            /tmp/maestro-debug
            /tmp/wrangler.log
          if-no-files-found: ignore
          retention-days: 7
