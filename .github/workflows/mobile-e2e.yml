name: Mobile E2E (Maestro)

# Informational (non-required) Android E2E smoke test running on standard hosted
# ubuntu-latest runners with KVM enabled, against a local Wrangler + local D1
# backend (zero EAS build credits consumed, never touches production or remote D1).
#
# Settled implementation notes (#200):
# - Triggered via path-filtered PRs touching mobile/shared/Maestro/test-login
#   files and manual workflow_dispatch.
# - Uses an env-gated "Test Sign In" button compiled only when BOTH
#   EXPO_PUBLIC_ALLOW_DEV_TEST_AUTH=true and a loopback http:// API URL are set.
# - Android first; iOS E2E is deferred to a later slice (either hosted macOS or
#   a self-hosted Mac runner).
# - Future pivot: self-hosted runners on Chris's server remain an option if
#   builds/emulators need more speed, the repo goes private, or iOS hardware is
#   added. Never attach self-hosted runners to untrusted fork PR workflows.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      - ".maestro/**"
      - "app/routes/api.v1.dev.test-login.ts"
      - "app/auth.server.ts"
      - "app/auth-context.server.ts"
      - ".github/workflows/mobile-e2e.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Mobile E2E (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Sync shared modules and version
        working-directory: mobile
        run: |
          node scripts/sync-shared.js
          node scripts/sync-version.js

      - name: Prepare local backend (D1 migrations + web build)
        run: |
          npx wrangler d1 migrations apply synx-db --local
          npm run build

      - name: Ensure dummy google-services.json for prebuild
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "mobile/google-services.json";
            if (!fs.existsSync(p)) {
              const dummy = {
                project_info: {
                  project_number: "000000000000",
                  project_id: "synx-e2e-local",
                  storage_bucket: "synx-e2e-local.firebasestorage.app"
                },
                client: [{
                  client_info: {
                    mobilesdk_app_id: "1:000000000000:android:0000000000000000000000",
                    android_client_info: { package_name: "io.christran.synx" }
                  },
                  oauth_client: [],
                  api_key: [{ current_key: "AIzaSyDummyLocalE2eKey000000000000000000" }],
                  services: { appinvite_service: { other_platform_oauth_client: [] } }
                }],
                configuration_version: "1"
              };
              fs.writeFileSync(p, JSON.stringify(dummy, null, 2));
            }
          '

      - name: Prebuild Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_ALLOW_DEV_TEST_AUTH: "true"
          EXPO_PUBLIC_API_URL: "http://127.0.0.1:8787"
        run: npx expo prebuild --platform android --non-interactive

      - name: Embed JS bundle in debug APK
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "mobile/android/app/build.gradle";
            let src = fs.readFileSync(p, "utf8");
            const target = "// debuggableVariants = [\"liteDebug\", \"prodDebug\"]";
            if (!src.includes(target)) {
              throw new Error("Could not find debuggableVariants placeholder in " + p);
            }
            src = src.replace(target, "debuggableVariants = []");
            fs.writeFileSync(p, src, "utf8");
          '

      - name: Build Android debug APK (x86_64)
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_ALLOW_DEV_TEST_AUTH: "true"
          EXPO_PUBLIC_API_URL: "http://127.0.0.1:8787"
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Start local Wrangler backend
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 --var ALLOW_DEV_TEST_AUTH:true --var MOBILE_MIN_BUILD_VERSION:1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/v1/mobile/version >/dev/null 2>&1; then
              echo "Local Wrangler backend ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wrangler.log || true
          exit 1

      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: "2.12.1"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"
            export MAESTRO_CLI_NO_ANALYTICS=1
            export MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true
            adb reverse tcp:8787 tcp:8787
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/smoke.yaml --debug-output /tmp/maestro-debug

            maestro test .maestro/widget-checkoff-seed.yaml --debug-output /tmp/maestro-debug/widget-seed

            read -r LIST_ID MIDDLE_TASK_ID < <(node -e '
              (async () => {
                const base = "http://127.0.0.1:8787";
                const loginRes = await fetch(base + "/api/v1/dev/test-login", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: "{}"
                });
                if (!loginRes.ok) throw new Error("test-login failed: " + loginRes.status);
                const { token } = await loginRes.json();
                const headers = { Authorization: "Bearer " + token };
                const listsRes = await fetch(base + "/api/v1/lists", { headers });
                if (!listsRes.ok) throw new Error("lists fetch failed: " + listsRes.status);
                const { lists } = await listsRes.json();
                const list = (lists || []).find((l) => l.name === "Widget Checkoff List");
                if (!list) throw new Error("Widget Checkoff List not found");
                const todosRes = await fetch(base + "/api/v1/todos?listId=" + encodeURIComponent(list.id), { headers });
                if (!todosRes.ok) throw new Error("todos fetch failed: " + todosRes.status);
                const { todos } = await todosRes.json();
                for (const name of ["Widget Task One", "Widget Task Two", "Widget Task Three"]) {
                  const t = (todos || []).find((x) => x.text === name);
                  if (!t || t.completed) throw new Error("Expected open seeded task: " + name);
                }
                const mid = todos.find((x) => x.text === "Widget Task Two");
                console.log(list.id + " " + mid.id);
              })().catch((e) => { console.error(e); process.exit(1); });
            ')
            echo "Seeded widget list=${LIST_ID} middleTask=${MIDDLE_TASK_ID}"

            FOUND_SNAPSHOT=0
            for i in $(seq 1 20); do
              if adb shell run-as io.christran.synx cat shared_prefs/expo.modules.widgets.xml 2>/dev/null | grep -q "$MIDDLE_TASK_ID"; then
                FOUND_SNAPSHOT=1
                break
              fi
              sleep 1
            done
            if [ "$FOUND_SNAPSHOT" -ne 1 ]; then
              echo "Pinned widget snapshot did not contain ${MIDDLE_TASK_ID}"
              adb shell run-as io.christran.synx cat shared_prefs/expo.modules.widgets.xml || true
              exit 1
            fi

            adb shell am broadcast \
              -a expo.modules.widgets.ACTION_WIDGET_INTERACTION \
              -n io.christran.synx/.PinnedListWidgetProvider \
              --es expo.modules.widgets.extra.SOURCE PinnedListWidget \
              --es expo.modules.widgets.extra.TARGET "complete:${MIDDLE_TASK_ID}"

            FOUND_PENDING=0
            for i in $(seq 1 10); do
              if adb shell run-as io.christran.synx cat shared_prefs/expo.modules.widgets.xml 2>/dev/null | grep -q "pendingCompletedAt"; then
                FOUND_PENDING=1
                break
              fi
              sleep 1
            done
            if [ "$FOUND_PENDING" -ne 1 ]; then
              echo "Widget snapshot did not record pendingCompletedAt after broadcast"
              adb shell run-as io.christran.synx cat shared_prefs/expo.modules.widgets.xml || true
              exit 1
            fi

            maestro test .maestro/widget-checkoff-verify.yaml --debug-output /tmp/maestro-debug/widget-verify

            LIST_ID="$LIST_ID" node -e '
              (async () => {
                const base = "http://127.0.0.1:8787";
                const loginRes = await fetch(base + "/api/v1/dev/test-login", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: "{}"
                });
                const { token } = await loginRes.json();
                const headers = { Authorization: "Bearer " + token };
                const todosRes = await fetch(base + "/api/v1/todos?listId=" + encodeURIComponent(process.env.LIST_ID), { headers });
                const { todos } = await todosRes.json();
                const byText = Object.fromEntries((todos || []).map((t) => [t.text, t]));
                if (byText["Widget Task One"]?.completed !== false) {
                  throw new Error("Widget Task One should remain incomplete: " + JSON.stringify(byText["Widget Task One"]));
                }
                if (byText["Widget Task Two"]?.completed !== true) {
                  throw new Error("Widget Task Two should be completed: " + JSON.stringify(byText["Widget Task Two"]));
                }
                if (byText["Widget Task Three"]?.completed !== false) {
                  throw new Error("Widget Task Three should remain incomplete: " + JSON.stringify(byText["Widget Task Three"]));
                }
                console.log("Verified only middle widget task completed");
              })().catch((e) => { console.error(e); process.exit(1); });
            '

      - name: Upload Maestro & Wrangler debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e-logs
          include-hidden-files: true
          path: |
            /tmp/maestro-debug
            /tmp/wrangler.log
          if-no-files-found: ignore
          retention-days: 7
