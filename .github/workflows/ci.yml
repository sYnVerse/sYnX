name: CI

# Lint, tests and typechecks on every pull request and on pushes to main.
# Runs on GitHub Actions only; it never starts an EAS build.
#
# Three jobs run in parallel, each only when its files change:
#   Web    - root lint, root tests, and web typecheck.
#   E2E    - Playwright smoke tests for the web list page against local wrangler dev.
#   Mobile - shared/ copy and version sync check, mobile typecheck, mobile
#            lint, Expo doctor, mobile unit tests, and mobile test typecheck.
# Changes that only touch docs, graphify-out/, or other workflow files run
# none. If you add branch protection, require the "Web", "E2E", and "Mobile" checks;
# a job skipped by its `if` counts as passing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API
    outputs:
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      # On pull requests this compares against the base branch; on pushes to
      # main it compares against the previous commit.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'app/**'
              - 'e2e/**'
              - 'shared/**'
              - 'test/**'
              - 'migrations/**'
              - 'public/**'
              - 'scripts/**'
              - 'server.ts'
              - 'load-context.ts'
              - 'worker-configuration.d.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
              - 'playwright.config.ts'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - 'postcss.config.js'
              - 'tailwind.config.ts'
              - 'wrangler.jsonc'
              - '.github/workflows/ci.yml'
            e2e:
              - 'app/**'
              - 'e2e/**'
              - 'public/**'
              - 'shared/**'
              - 'migrations/**'
              - 'server.ts'
              - 'load-context.ts'
              - 'worker-configuration.d.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
              - 'playwright.config.ts'
              - 'vite.config.ts'
              - 'wrangler.jsonc'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'shared/**'
              - 'test/mobile-*.ts'
              - 'test/android-*.ts'
              - 'test/widget-*.ts'
              - 'test/post-build-comment.test.ts'
              - 'test/tsconfig.mobile.json'
              - '.github/workflows/ci.yml'

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      # Root tests import mobile code, so the mobile deps are needed too.
      - run: npm ci
        working-directory: mobile
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run --maxWorkers=2
      - name: Web typecheck
        run: npm run typecheck

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply synx-db --local
      - name: Build web
        run: npm run build
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: shared/ copy and mobile version are in sync
        working-directory: mobile
        run: |
          node scripts/sync-shared.js
          node scripts/sync-version.js
          git diff --exit-code
      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck
      # Expo's ESLint setup (mobile/eslint.config.js). The lint script uses
      # --max-warnings 0, so any error or warning fails the job.
      - name: Mobile lint
        working-directory: mobile
        run: npm run lint
      - name: Expo doctor
        working-directory: mobile
        run: npm run doctor
      - name: Typecheck tests that import mobile code
        run: npm run typecheck:mobile-tests
      - name: Mobile tests
        run: npm run test:mobile
