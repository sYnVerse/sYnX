name: CI

# Lint, tests and typechecks on every pull request.
# Runs on GitHub Actions only; it never starts an EAS build.
#
# Four jobs run in parallel, each only when its files change:
#   Backend - backend typecheck, local D1 migrations check, Worker build, and wrangler dry-run.
#   Web     - root lint, React Compiler transform check, root tests, and workspace typechecks.
#   E2E     - Playwright smoke tests against local wrangler dev and local D1.
#   Mobile  - shared/ copy and version sync check, mobile typecheck, mobile
#             lint, Expo doctor, mobile unit tests, and mobile test typecheck.
# Changes that only touch docs, graphify-out/, or other workflow files run
# none. If you add branch protection, require the "Backend", "Web", "E2E", and
# "Mobile" checks; a job skipped by its `if` counts as passing.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      # On pull requests this compares against the base branch.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'test/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'shared/**'
              - 'test/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            e2e:
              - 'web/**'
              - 'backend/**'
              - 'e2e/**'
              - 'shared/**'
              - 'scripts/verify-react-compiler-bundle.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'shared/**'
              - 'test/mobile-*.ts'
              - 'test/android-*.ts'
              - 'test/widget-*.ts'
              - 'test/post-build-comment.test.ts'
              - 'test/tsconfig.mobile.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Backend typecheck
        run: npm --workspace=backend run typecheck
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply synx-db --local --config backend/wrangler.jsonc --persist-to backend/.wrangler/state
      - name: Build Worker bundle
        run: npm run build
      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run --config web/build/server/wrangler.json

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verify React Compiler transform
        run: node scripts/verify-react-compiler-bundle.mjs --transform-only
      - name: Tests
        run: npm test -- --run --maxWorkers=2
      - name: Web typecheck
        run: npm run typecheck

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply synx-db --local --config backend/wrangler.jsonc --persist-to backend/.wrangler/state
      - name: Build web
        run: npm run build
      - name: Verify React Compiler bundle
        run: node scripts/verify-react-compiler-bundle.mjs
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: shared/ copy and mobile version are in sync
        working-directory: mobile
        run: |
          node scripts/sync-shared.js
          node scripts/sync-version.js
          git diff --exit-code
      - name: Mobile typecheck
        run: npm --workspace=mobile run typecheck
      # Expo's ESLint setup (mobile/eslint.config.js). The lint script uses
      # --max-warnings 0, so any error or warning fails the job.
      - name: Mobile lint
        run: npm --workspace=mobile run lint
      - name: Expo doctor
        run: npm --workspace=mobile run doctor
      - name: Typecheck tests that import mobile code
        run: npm run typecheck:mobile-tests
      - name: Mobile tests
        run: npm run test:mobile
